# peft.example.yaml
targets:
  - attn.q
  - attn.o
rank: 8
alpha: 16
optim:
  lr: 5.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
schedule:
  steps: 500
  conserve_mode_after_min_ema:
    lr_scale: 0.7
    force_write_prob: 0.02
    surprise_gate_delta: 0.05
eval:
  holdout_size: 512
  accept_if:
    tokens_per_sec_vs_cpu: 1.3
    hot_swap_latency_ms: 200
